name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Pinned to a commit: this job runs on pull_request_target with a write token.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/celune-ai/celune/blob/main/CLA.md
          # Signatures are stored as JSON on a branch that only this workflow writes to.
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: smejkaldesign,celune-ai,dependabot[bot],github-actions[bot],changeset-bot[bot]
          lock-pullrequest-aftermerge: false
