<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Verify your identity</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #060a07;
      font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <!-- Wrapper -->
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #060a07"
    >
      <tr>
        <td align="center" style="padding: 48px 24px">
          <!-- Card -->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 460px;
              background-color: #080c09;
              border: 1px solid #142018;
              border-radius: 12px;
            "
          >
            <!-- Logo — dark pill (Gmail-proof) -->
            <tr>
              <td align="center" style="padding: 40px 40px 0">
                <div
                  style="
                    display: inline-block;
                    background-color: #060a07;
                    border-radius: 8px;
                    padding: 8px 12px;
                  "
                >
                  <img
                    src="https://celune.ai/celune-light.png"
                    alt="Celune"
                    width="110"
                    style="display: block"
                  />
                </div>
              </td>
            </tr>

            <!-- Heading -->
            <tr>
              <td align="center" style="padding: 24px 40px 0">
                <h1
                  style="
                    margin: 0;
                    font-size: 20px;
                    font-weight: 600;
                    color: #fafafa;
                    letter-spacing: -0.02em;
                  "
                >
                  Verify your identity
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td align="center" style="padding: 12px 40px 0">
                <p style="margin: 0; font-size: 14px; line-height: 22px; color: #a0a0a0">
                  A sensitive action was requested on your account. Use the code below to confirm
                  your identity.
                </p>
              </td>
            </tr>

            <!-- OTP Code -->
            <tr>
              <td align="center" style="padding: 28px 40px 0">
                <div
                  style="
                    display: inline-block;
                    padding: 16px 40px;
                    background-color: #1a1a1a;
                    border: 1px solid #2a2a2a;
                    border-radius: 8px;
                  "
                >
                  <span
                    style="
                      font-size: 32px;
                      font-weight: 700;
                      color: #fafafa;
                      letter-spacing: 0.3em;
                      font-family: 'Source Code Pro', 'SF Mono', monospace;
                    "
                    >{{ .Token }}</span
                  >
                </div>
              </td>
            </tr>

            <!-- Expiry -->
            <tr>
              <td align="center" style="padding: 16px 40px 0">
                <p style="margin: 0; font-size: 12px; line-height: 18px; color: #666666">
                  This code expires in 10 minutes.
                </p>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 24px 40px 0">
                <div style="height: 1px; background-color: #142018"></div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding: 24px 40px 36px">
                <p style="margin: 0; font-size: 11px; color: #444444">
                  If you didn't initiate this request, please secure your account immediately by
                  changing your password.
                </p>
              </td>
            </tr>
          </table>
          <!-- End Card -->

          <!-- Brand footer -->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 460px"
          >
            <tr>
              <td align="center" style="padding: 20px 0 0">
                <p style="margin: 0; font-size: 11px; color: #333333">Celune</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
