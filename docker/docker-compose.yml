# Celune self-host stack: Supabase (Postgres, Auth, REST, Realtime, Storage,
# Kong gateway, optional Studio), a one-shot migrate job, the standalone API,
# and the web app, all on the community edition.
#
#   npx @celuneai/cli init --mode docker     # writes docker/.env with generated secrets
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Ports (host): web 3000, api 3010, Supabase gateway 8000, Postgres 54322
# (bound to 127.0.0.1), Studio 54323 with `--profile studio`.
#
# There is no separate worker service. Server agent runs execute inside the
# web app (the executions route calls runServerJob in-process), and polling
# agents (IDE, CLI) claim jobs through the API.

name: celune

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?run npx @celuneai/cli init or fill docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # Creates supabase_functions_admin, which roles.sql sets a password for
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-54322}:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # Closed by default; SETUP.md covers the first account and opening sign-up.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run npx @celuneai/cli init or fill docker/.env}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ['postgrest']
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        # Realtime resolves its tenant from the first label of the host name Kong calls.
        aliases:
          - realtime-dev.supabase-realtime
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?run npx @celuneai/cli init or fill docker/.env}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run npx @celuneai/cli init or fill docker/.env}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?run npx @celuneai/cli init or fill docker/.env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?run npx @celuneai/cli init or fill docker/.env}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://storage:5000/status']
      interval: 5s
      timeout: 5s
      retries: 20

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/home/kong/kong-entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    ports:
      - ${KONG_HTTP_PORT:-8000}:8000

  # Applies packages/db/schema with packages/db/scripts/boot-local.sh: the baseline on
  # an empty database, then any newer migration files in order.
  # Waits for Auth and Storage because migrations reference auth.users and
  # storage.buckets. Re-runs skip files already recorded in public._migrations.
  migrate:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - ../packages/db:/celune/db:ro
    entrypoint: ['bash', '-c']
    command:
      - bash /celune/db/scripts/boot-local.sh && psql "$$DATABASE_URL" -X -q -c "NOTIFY pgrst, 'reload schema'"
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_started
    environment:
      PORT: 3010
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CELUNE_EDITION: community
      CELUNE_API_KEY_PREFIX: ${CELUNE_API_KEY_PREFIX:-celune}
      CELUNE_HOST_JWT_SECRET: ${CELUNE_HOST_JWT_SECRET:?run npx @celuneai/cli init or fill docker/.env}
      CELUNE_HOST_JWKS_URL: ${CELUNE_HOST_JWKS_URL:-}
      CELUNE_HOST_JWT_ISSUER: ${CELUNE_HOST_JWT_ISSUER:-}
      CELUNE_HOST_JWT_AUDIENCE: ${CELUNE_HOST_JWT_AUDIENCE:-}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:?run npx @celuneai/cli init or fill docker/.env}
      # Optional until the legacy fallback is removed; celune init generates it.
      JOB_HMAC_KEY: ${JOB_HMAC_KEY:-}
    ports:
      - ${API_PORT:-3010}:3010
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3010/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-localhost}
        NEXT_PUBLIC_MARKETING_DOMAIN: ${APP_DOMAIN:-localhost}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-admin@localhost}
        NEXT_PUBLIC_AUTH_PROVIDERS: ${AUTH_PROVIDERS:-email}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_started
    command: ['node', '/celune/web-entrypoint.mjs']
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SUPABASE_UPSTREAM: kong:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-localhost}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ALLOWED_ORIGINS: ${SITE_URL:-http://localhost:3000}
      CELUNE_EDITION: community
      CELUNE_API_KEY_PREFIX: ${CELUNE_API_KEY_PREFIX:-celune}
      CELUNE_HOST_JWT_SECRET: ${CELUNE_HOST_JWT_SECRET}
      CELUNE_HOST_JWKS_URL: ${CELUNE_HOST_JWKS_URL:-}
      CELUNE_HOST_JWT_ISSUER: ${CELUNE_HOST_JWT_ISSUER:-}
      CELUNE_HOST_JWT_AUDIENCE: ${CELUNE_HOST_JWT_AUDIENCE:-}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY}
      JOB_HMAC_KEY: ${JOB_HMAC_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?run npx @celuneai/cli init or fill docker/.env}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?run npx @celuneai/cli init or fill docker/.env}
      CRON_SECRET: ${CRON_SECRET:?run npx @celuneai/cli init or fill docker/.env}
      HOOK_SECRET: ${HOOK_SECRET:?run npx @celuneai/cli init or fill docker/.env}
    volumes:
      - ./web-entrypoint.mjs:/celune/web-entrypoint.mjs:ro
    ports:
      - ${WEB_PORT:-3000}:3000

  meta:
    image: supabase/postgres-meta:v0.99.0
    profiles: ['studio']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    profiles: ['studio']
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Celune
      DEFAULT_PROJECT_NAME: Celune
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
    ports:
      - 127.0.0.1:${STUDIO_PORT:-54323}:3000

volumes:
  db-data:
  db-config:
  storage-data:
